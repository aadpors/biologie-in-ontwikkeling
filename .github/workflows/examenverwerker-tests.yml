name: Examenverwerker tests

on:
  push:
    branches: [main, "bouw/**"]
    paths: ["examenverwerker/**", ".github/workflows/examenverwerker-tests.yml"]
  pull_request:
    paths: ["examenverwerker/**", ".github/workflows/examenverwerker-tests.yml"]
  workflow_dispatch:

concurrency:
  group: examenverwerker-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examenverwerker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Controleer dat de volledige desktopapp importeert
        run: python -c "import app; from engine import pdf_page_count, pixel_rect_to_pdf_bbox; print('Application import OK')"
      - name: Analyseer echte examen-PDFs uit de repository
        run: python scripts/benchmark_exams.py
      - run: python -m compileall -q app.py engine.py exporter.py ai_adapter.py structure.py scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: examenverwerker-integratierapport-${{ matrix.os }}
          path: examenverwerker/artifacts/exam-analysis-report.json
          if-no-files-found: ignore
          retention-days: 30
