name: Examenverwerker tests

on:
  push:
    branches: [main, "bouw/**"]
    paths: ["examenverwerker/**", ".github/workflows/examenverwerker-tests.yml"]
  pull_request:
    paths: ["examenverwerker/**", ".github/workflows/examenverwerker-tests.yml"]
  workflow_dispatch:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examenverwerker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py engine.py
