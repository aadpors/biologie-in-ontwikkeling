# CI voor de zelfstandige Examenverwerker 0.13.0.
# De workflow test uitsluitend de versie-map en raakt de bestaande sitebuild niet.
name: Examenverwerker 0.13

on:
  push:
    paths:
      - "examenverwerker/0.13/**"
      - ".github/workflows/examenverwerker-013.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examenverwerker/0.13
    steps:
      - name: Haal repository op
        uses: actions/checkout@v4

      - name: Stel Python in
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: examenverwerker/0.13/requirements.txt

      - name: Installeer Python-afhankelijkheden
        run: python -m pip install -r requirements.txt

      - name: Voer alle unittests en API-integratietests uit
        run: python -m unittest discover -s tests -v

      - name: Controleer JavaScript-syntaxis
        run: node --check static/app.js
