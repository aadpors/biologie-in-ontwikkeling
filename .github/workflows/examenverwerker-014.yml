# CI voor de zelfstandige Examenverwerker 0.14.0.
# De workflow controleert uitsluitend de versie-map en raakt de sitebuild niet.
name: Examenverwerker 0.14

on:
  push:
    paths:
      - "examenverwerker/0.14/**"
      - ".github/workflows/examenverwerker-014.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examenverwerker/0.14
    steps:
      - name: Haal repository op
        uses: actions/checkout@v4

      - name: Stel Python in
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: examenverwerker/0.14/requirements.txt

      - name: Installeer Python-afhankelijkheden
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Voer alle unittests en API-integratietests uit
        run: python -m unittest discover -s tests -v

      - name: Controleer JavaScript-syntaxis
        run: node --check static/app.js
