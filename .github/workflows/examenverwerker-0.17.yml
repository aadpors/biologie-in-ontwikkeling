name: Examenverwerker 0.17

on:
  push:
    branches:
      - bouw/examenverwerker-0.17-afmaken
    paths:
      - "examenverwerker/0.17/**"
      - ".github/workflows/examenverwerker-0.17.yml"
  pull_request:
    paths:
      - "examenverwerker/0.17/**"
      - ".github/workflows/examenverwerker-0.17.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Haal alleen de map van versie 0.17 op
        uses: actions/checkout@v4
        with:
          sparse-checkout: examenverwerker/0.17
          sparse-checkout-cone-mode: true

      - name: Stel Python in
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examenverwerker/0.17/requirements*.txt

      - name: Installeer applicatie- en testafhankelijkheden
        working-directory: examenverwerker/0.17
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Controleer Python-syntaxis
        working-directory: examenverwerker/0.17
        run: python -m compileall -q examenverwerker tests

      - name: Voer alle tests uit
        working-directory: examenverwerker/0.17
        run: python -m unittest discover -s tests -v

      - name: Controleer JavaScript-syntaxis
        working-directory: examenverwerker/0.17
        run: node --check static/app.js
