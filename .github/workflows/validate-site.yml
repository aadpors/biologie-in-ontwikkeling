name: Validate website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'publicaties.json'
      - 'examenoefenen.html'
      - 'exam-mcq.json'
      - 'exam-open.json'
      - 'exam-contexts.json'
      - 'beheer-7f4d9b2c/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'docs/exam-management.md'
      - 'scripts/extract-mcq-questions.py'
      - 'scripts/trim-question-image-edges.py'
      - 'scripts/fix-mcq-options.py'
      - 'scripts/fix-open-question-crops.py'
      - 'scripts/validate-exam-snippets.py'
      - 'scripts/validate-site.mjs'
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Render exam snippets"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      exam: ${{ steps.filter.outputs.exam }}
    steps:
      - name: Detect whether exam files changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            exam:
              - 'examenoefenen.html'
              - 'exam-mcq.json'
              - 'exam-open.json'
              - 'exam-contexts.json'
              - 'exam-snippets/**'
              - 'examens/**'
              - 'examenverwerker/**'
              - 'scripts/extract-binary-cv-text.py'
              - 'scripts/extract-mcq-questions.py'
              - 'scripts/fix-ha25t1-q34.py'
              - 'scripts/fix-mcq-options.py'
              - 'scripts/fix-open-question-crops.py'
              - 'scripts/render-cv-snippets.py'
              - 'scripts/render-exam-snippets.py'
              - 'scripts/restore-exam-rubricering.py'
              - 'scripts/trim-question-image-edges.py'
              - 'scripts/validate-exam-snippets.py'
              - 'scripts/exam-rubricering.json'
              - 'scripts/exam-snippets.json'
              - 'scripts/cv-snippets.json'
              - 'tests/examenoefenen-browser-test.cjs'
              - 'supabase/functions/inventory-exam-upload/**'
              - 'supabase/migrations/**'

  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate publication data and frontend
        run: node scripts/validate-site.mjs
      - name: Validate hidden exam-management interface JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('beheer-7f4d9b2c/index.html', 'utf8');
          const openTag = '<script>';
          const closeTag = '</script>';
          const scripts = [];
          let cursor = 0;
          while (true) {
            const start = html.indexOf(openTag, cursor);
            if (start === -1) break;
            const bodyStart = start + openTag.length;
            const end = html.indexOf(closeTag, bodyStart);
            if (end === -1) throw new Error('Niet-afgesloten script-tag');
            scripts.push(html.slice(bodyStart, end));
            cursor = end + closeTag.length;
          }
          if (!scripts.length) throw new Error('Geen inline beheerscript gevonden');
          for (const [index, source] of scripts.entries()) {
            new Function(source);
            console.log(`Beheerscript ${index + 1}: syntaxis OK`);
          }
          for (const required of ['exam-inbox', 'exam_ingest_jobs', 'exam_ingest_events']) {
            if (!html.includes(required)) throw new Error(`Ontbrekende koppeling: ${required}`);
          }
          NODE

  reprocess:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.exam == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exam data under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free PDF processing dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF Pillow
      - name: Audit official marking criteria for binary questions
        run: python scripts/extract-binary-cv-text.py
      - name: Regenerate all original exam material
        run: |
          rm -rf exam-snippets
          mkdir -p exam-snippets
          python scripts/render-exam-snippets.py
          python scripts/render-cv-snippets.py
          python scripts/extract-mcq-questions.py
          python scripts/fix-mcq-options.py
          python scripts/fix-open-question-crops.py
          python scripts/trim-question-image-edges.py
      - name: Validate every generated question, image and appendix link
        run: python scripts/validate-exam-snippets.py
      - name: Validate complete website data
        run: |
          node scripts/validate-site.mjs
      - name: Upload generated material for full visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-exam-reprocessing-review
          path: |
            exam-mcq.json
            exam-open.json
            exam-contexts.json
            exam-snippets/
          if-no-files-found: warn
          retention-days: 14

  browser-practical:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.exam == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out commit under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Set up Python for correction-scheme rendering
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate original question, context and CV images for browser tests
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF Pillow
          rm -rf exam-snippets
          mkdir -p exam-snippets
          python scripts/render-exam-snippets.py
          python scripts/extract-mcq-questions.py
          python scripts/fix-mcq-options.py
          python scripts/fix-open-question-crops.py
          python scripts/trim-question-image-edges.py
          python scripts/render-cv-snippets.py
      - name: Audit official marking criteria for binary questions
        run: python scripts/extract-binary-cv-text.py
      - name: Serve the exact PR website
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/exam-site.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/examenoefenen.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/exam-site.log
          exit 1
      - name: Exercise the old exam route in Chromium
        run: node tests/examenoefenen-browser-test.cjs


  homepage-browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out commit under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve the homepage under review
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/homepage-site.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/homepage-site.log
          exit 1
      - name: Test homepage search, filters and responsive layout in Chromium
        run: node tests/homepage-browser-test.cjs
      - name: Upload homepage screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-search-filter-browser-review
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
