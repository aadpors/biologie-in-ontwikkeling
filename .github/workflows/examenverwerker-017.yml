name: Examenverwerker 0.17
on:
  push:
    paths:
      - "examenverwerker/0.17/**"
      - ".github/workflows/examenverwerker-017.yml"
      - "examens/vw-1018-a-26-2-o.pdf"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examenverwerker/0.17
    steps:
      - name: Haal repository op
        uses: actions/checkout@v4
      - name: Stel Python in
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: examenverwerker/0.17/requirements.txt
      - name: Installeer afhankelijkheden
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Voer tests uit
        run: python -m unittest discover -s tests -v
      - name: Controleer JavaScript
        run: node --check static/app.js
      - name: Analyseer echt vwo-examen voor fragmentdiagnose
        run: python tools/diagnose_real_exam.py
        env:
          EXAM_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/exam-diagnostic
      - name: Bewaar diagnosebeeld en detectierapport
        uses: actions/upload-artifact@v4
        with:
          name: exam-fragment-diagnostics
          path: ${{ runner.temp }}/exam-diagnostic/
          retention-days: 7
