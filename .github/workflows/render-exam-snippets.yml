name: Render exam snippets
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'examens/*.pdf'
      - 'scripts/render-exam-snippets.py'
      - 'scripts/render-cv-snippets.py'
      - 'scripts/cv-snippets.json'
      - 'scripts/extract-mcq-questions.py'
      - 'scripts/trim-question-image-edges.py'
      - 'scripts/validate-exam-snippets.py'
      - 'scripts/exam-snippets.json'
      - '.github/workflows/render-exam-snippets.yml'
  push:
    branches: [main]
    paths:
      - 'examens/*.pdf'
      - 'scripts/render-exam-snippets.py'
      - 'scripts/render-cv-snippets.py'
      - 'scripts/extract-mcq-questions.py'
      - 'examenoefenen.html'
      - 'scripts/validate-exam-snippets.py'
      - 'scripts/exam-snippets.json'
      - 'scripts/cv-snippets.json'
      - 'site-version.json'
      - '.github/workflows/render-exam-snippets.yml'
permissions:
  contents: write

# Voorkom gelijktijdige renders die elkaars gegenereerde commit overschrijven.
concurrency:
  group: render-exam-snippets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clear all previous generated snippets
        run: |
          rm -rf exam-snippets
          mkdir -p exam-snippets
      - name: Install PDF renderer
        run: pip install PyMuPDF Pillow
      - name: Render selected original exam fragments
        run: python scripts/render-exam-snippets.py
      - name: Render official marking-scheme snippets
        run: python scripts/render-cv-snippets.py
      - name: Extract multiple-choice questions from all available exams
        run: python scripts/extract-mcq-questions.py
      - name: Trim source-page separators below all question images
        run: python scripts/trim-question-image-edges.py
      - name: Validate every generated question and image
        run: python scripts/validate-exam-snippets.py
      - name: Commit generated image snippets
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain exam-snippets exam-mcq.json exam-open.json exam-contexts.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add exam-snippets/ exam-mcq.json exam-open.json exam-contexts.json
            git commit -m "Add original exam image snippets"
            # Bewaar de gegenereerde boom en zet bij iedere poging eerst
            # main recht. Een rebase kan bij opnieuw gegenereerde JPG/PNG-
            # bestanden niet automatisch samenvoegen en veroorzaakte eerder
            # binaire conflicten. Neem daarom de volledige gegenereerde
            # outputboom over op de nieuwste main en maak daarop een nieuwe commit.
            generated_commit=$(git rev-parse HEAD)
            pushed=false
            target_branch="${GITHUB_HEAD_REF:-main}"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              git checkout "$generated_commit" -- exam-snippets/ exam-mcq.json exam-open.json exam-contexts.json
              git add exam-snippets/ exam-mcq.json exam-contexts.json
              if git diff --cached --quiet; then
                echo "Generated snippets are already current."
                pushed=true
                break
              fi
              git commit -m "Add original exam image snippets"
              if git push origin "HEAD:$target_branch"; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed; synchronizing with main again."
              sleep 2
            done
            if [[ "$pushed" != true ]]; then
              echo "Gegenereerde snippets konden na vijf pogingen niet worden gepubliceerd."
              exit 1
            fi
          else
            echo "Exam snippets are already up to date."
          fi
      - name: Upload generated snippets for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: exam-snippets-qa
          path: exam-snippets/
          retention-days: 2
