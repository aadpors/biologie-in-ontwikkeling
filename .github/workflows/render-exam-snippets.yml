name: Render exam snippets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'examens/*.pdf'
      - 'scripts/render-exam-snippets.py'
      - 'scripts/exam-snippets.json'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: pip install PyMuPDF
      - name: Render selected original exam fragments
        run: python scripts/render-exam-snippets.py
      - name: Commit generated image snippets
        run: |
          if [[ -n "$(git status --porcelain exam-snippets)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add exam-snippets/
            git commit -m "Add original exam image snippets"
            git push
          else
            echo "Exam snippets are already up to date."
          fi
