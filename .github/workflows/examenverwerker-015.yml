# Geautomatiseerde regressie- en integratietests voor Examenverwerker 0.15.
name: Examenverwerker 0.15
on:
  push:
    paths:
      - "examenverwerker/0.15/**"
      - ".github/workflows/examenverwerker-015.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examenverwerker/0.15
    steps:
      - name: Haal repository op
        uses: actions/checkout@v4
      - name: Stel Python in
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: examenverwerker/0.15/requirements.txt
      - name: Installeer Python-afhankelijkheden
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Voer alle unittests en API-integratietests uit
        run: python -m unittest discover -s tests -v
      - name: Controleer JavaScript-syntaxis
        run: node --check static/app.js
