name: Reprocess all biology exams

on:
  pull_request:
    paths:
      - "scripts/**"
      - "examens/**"
      - "exam-mcq.json"
      - "exam-open.json"
      - "exam-contexts.json"
      - ".github/workflows/reprocess-exams.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free processing dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF Pillow
      - name: Render curated exam question and context snippets
        run: python scripts/render-exam-snippets.py
      - name: Render official marking-scheme snippets
        run: python scripts/render-cv-snippets.py
      - name: Extract every exam question and context
        run: python scripts/extract-mcq-questions.py
      - name: Validate generated snippets and printable appendix links
        run: python scripts/validate-exam-snippets.py
      - name: Validate complete website data
        run: node scripts/validate-site.mjs
      - name: Upload generated review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-exam-reprocessing-review
          path: |
            exam-mcq.json
            exam-open.json
            exam-contexts.json
            exam-snippets/
          if-no-files-found: warn
          retention-days: 14
